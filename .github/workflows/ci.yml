name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Test installed package and CLI
        run: python -m unittest discover -s tests -v
      - name: Check distributed schema
        run: python tools/generate_schema.py --check
      - name: Check CLI entry point
        run: agentbridge --version
      - name: Run local end-to-end demo
        run: python examples/local_demo.py --root .validation/ci-demo
      - name: Run offline Git end-to-end demo
        run: python examples/git_demo.py --root .validation/ci-git-demo
      - name: Check whitespace
        run: git diff --check
