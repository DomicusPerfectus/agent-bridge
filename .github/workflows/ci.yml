name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          allow-prereleases: false
      - name: Show validation environment
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"
      - name: Install package and test dependencies
        run: python -m pip install ".[test]" "setuptools>=68" wheel
      - name: Test installed package and CLI
        run: python -m unittest discover -s tests -v
      - name: Check distributed schema
        run: python tools/generate_schema.py --check
      - name: Check CLI entry point
        run: agentbridge --version
      - name: Run local end-to-end demo
        run: python examples/local_demo.py --root .validation/ci-demo
      - name: Run offline Git end-to-end demo
        run: python examples/git_demo.py --root .validation/ci-git-demo
      - name: Verify offline fresh clone and installed wheel
        run: python tools/verify_fresh_clone.py
      - name: Check whitespace
        run: git diff --check
