[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "A local-first, provider-neutral protocol for structured agent handoffs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["agents", "handoff", "protocol", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]

[project.scripts]
agentbridge = "agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_bridge*"]

[tool.setuptools.package-data]
"agent_bridge.protocol" = ["schema.json"]
